# ==============================================================================
# TMUX CONFIGURATION (Optimized for Neovim)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Neovim Compatibility & Terminal Settings
# ------------------------------------------------------------------------------
# Eliminate Esc key delay in Neovim (default is 500ms which feels laggy)
set -sg escape-time 10

# Forward terminal focus events so Neovim can run FocusGained / FocusLost autocommands
set -g focus-events on

# Enable 24-bit True Color and 256 colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,*:RGB"
set -ag terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc,xterm*:Tc"

# Support undercurl and undercurl colors (essential for Neovim LSP diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable OSC 52 system clipboard integration (seamless with Neovim unnamedplus)
set -s set-clipboard on

# Enable mouse support
set -g mouse on

# ------------------------------------------------------------------------------
# 2. Prefix Key
# ------------------------------------------------------------------------------
# NOTE: In Neovim (nvim-cmp), Ctrl+Space is mapped to trigger autocompletion.
# If tmux prefix is Ctrl+Space, press Ctrl+Space twice to send it to Neovim.
# Alternatively, to avoid this, uncomment the C-a lines below:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ------------------------------------------------------------------------------
# 3. Window & Pane Indexing
# ------------------------------------------------------------------------------
# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ------------------------------------------------------------------------------
# 4. Navigation & Splits
# ------------------------------------------------------------------------------
# Smart pane switching with awareness of Neovim splits (christoomey/vim-tmux-navigator)
# Allows Ctrl+h/j/k/l to navigate smoothly across both Neovim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Fallback prefix-based pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift-Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Splits (open in current pane's directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# 5. Vi Copy Mode Keybindings
# ------------------------------------------------------------------------------
# Use vi keybindings in copy mode
set-window-option -g mode-keys vi
# Simpler ways in: prefix + v, or PageUp (enters and scrolls up; -e exits again at the bottom)
bind v copy-mode
bind -n PageUp copy-mode -eu
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Support Ctrl+h/j/k/l navigation while in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ------------------------------------------------------------------------------
# 6. Configuration Reload
# ------------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# ------------------------------------------------------------------------------
# 7. Colorscheme: Claude Code "dark-daltonized" (fixed hex) on #300A24
# ------------------------------------------------------------------------------
# Fixed RGB values, independent of the terminal's ANSI palette (same as
# ~/.config/nvim/colors/claude-daltonized.lua).
#   bg #300A24   text #FFFFFF   orange #FF9933   blue #3399FF   light blue #99CCFF
#   yellow #FFCC00   cyan #66CCCC   inactive #999999   subtle #505050
#   selection #264F78   red #FF6666

# Paint every pane and the status bar with the same background Neovim uses
set -g window-style "fg=#FFFFFF,bg=#300A24"
set -g window-active-style "fg=#FFFFFF,bg=#300A24"

set -g status "on"
set -g status-style "fg=#FFFFFF,bg=#300A24"

# Window tabs
set -g window-status-separator "  "
set -g window-status-style "fg=#999999,bg=#300A24"
set -g window-status-format "#[fg=#999999,bg=#300A24]#I:#W"
set -g window-status-current-style "fg=#99CCFF,bold,bg=#300A24"
set -g window-status-current-format "#[fg=#99CCFF,bold,bg=#300A24][#I:#W]"
set -g window-status-activity-style "fg=#FFCC00,bg=#300A24"
set -g window-status-bell-style "fg=#FF6666,bold,bg=#300A24"

# Status bar left & right
set -g status-left-length 40
set -g status-left "#[fg=#FF9933,bold,bg=#300A24]#S #[fg=#999999,nobold,bg=#300A24]• "
set -g status-right-length 60
set -g status-right "#{prefix_highlight} #[fg=#999999,bg=#300A24]%Y-%m-%d %H:%M #[fg=#66CCCC,bold,bg=#300A24]#h "

# Pane borders and the display-panes overlay
set -g pane-border-style "fg=#505050,bg=#300A24"
set -g pane-active-border-style "fg=#FF9933,bg=#300A24"
set -g display-panes-colour "#99CCFF"
set -g display-panes-active-colour "#FF9933"
set -g clock-mode-colour "#3399FF"

# Command messages, copy mode selection and search matches
set -g message-style "fg=#FFCC00,bold,bg=#300A24"
set -g message-command-style "fg=#FFCC00,bg=#300A24"
set -g mode-style "fg=#FFFFFF,bg=#264F78"
set -g copy-mode-match-style "fg=#000000,bg=#FFCC00"
set -g copy-mode-current-match-style "fg=#000000,bg=#FF9933"

# Prefix highlight (yellow when the prefix is pressed)
set -g @prefix_highlight_bg '#FFCC00'
set -g @prefix_highlight_fg '#000000'

# ------------------------------------------------------------------------------
# 8. TPM Plugins
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Run TPM (MUST BE KEPT AT THE VERY BOTTOM OF THE FILE)
run '~/.tmux/plugins/tpm/tpm'
